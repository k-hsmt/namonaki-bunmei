name: Issue 38 D1a — fauna silhouette and motion gallery
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/lib/fauna38-d1a.mjs
      - scripts/preview-fauna38-d1a.mjs
      - scripts/templates/fauna38-d1a-gallery.html
      - tests/fauna38-d1a.test.mjs
      - docs/issue38-d1a-review.md
      - .github/workflows/issue38-d1a.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue38-d1a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Build canonical architecture for the reference house
        run: npm run build
      - name: Validate deterministic species, sizes and poses
        run: node --test tests/fauna38-d1a.test.mjs
      - name: Generate 288 original native-resolution PNG and gallery
        run: node scripts/preview-fauna38-d1a.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fauna38-d1a-silhouette-motion-gallery
          path: artifacts/fauna38-d1a/**
          if-no-files-found: warn
          retention-days: 21
