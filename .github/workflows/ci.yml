name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/issue31-*', 'feat/issue34-*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Audit 1,000 terrain result records
        run: node scripts/audit-terrain-record.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-record-capacity
          path: artifacts/terrain31-record/capacity-audit.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h4d4-site-audit
          path: artifacts/h4d4-site-audit/report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h4d7b-natural-audit
          path: artifacts/h4d7b-natural/audit.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h4d5-natural-placement
          path: artifacts/h4d5-siting/natural-placement.json
          if-no-files-found: warn
      - name: Render Issue 35 D1 architecture prototype gallery
        run: node scripts/preview-architecture.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture35-d1-gallery
          path: artifacts/architecture35-d1/*
          if-no-files-found: error

  visual-browser:
    # Keep Chromium/WebKit dependencies stable across ubuntu-latest image rollouts.
    # The 26.04 rollout spent almost 13 minutes fetching packages in this job.
    runs-on: ubuntu-24.04
    # Package mirrors can consume 9+ minutes before any test starts. Keep their
    # allowance separate; annual, save and frame budgets remain in the scripts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 12
      - run: npm run test:browser
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-terrain-trial-browser
          path: artifacts/environment34-terrain-trial-tests/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-terrain-production-browser
          path: artifacts/environment34-terrain-production-tests/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-terrain-ui-browser
          path: artifacts/environment34-terrain-ui-tests/*.png
          if-no-files-found: error
      - name: Capture D7-C natural public-space review
        run: node scripts/review-public-spaces.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preview Issue 31 river terrain prototypes
        run: node scripts/preview-river-terrain.mjs
      - name: Preview Issue 31 hill terrain prototypes
        run: node scripts/preview-hill-terrain.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preview Issue 31 coasts, mountains and watershed
        run: node scripts/preview-world-terrain.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify saved terrain without generators
        run: node scripts/review-terrain-record.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify legacy v2/v3/v4 terrain compatibility
        run: node scripts/review-legacy-terrain-save.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare provisional ground limits across three districts
        run: node scripts/review-ground-access.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Capture generated bridge history at native and four-times scale
        run: node scripts/review-generated-bridges.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify 10,000-year save in Chromium localStorage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/probe-h3-browser-storage.mjs | tee artifacts/h3-browser-storage.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-a-comparison
          path: |
            artifacts/visual-a/*.png
            artifacts/history-b/*
            artifacts/h1-housing/*
            artifacts/h3-browser-storage.jsonl
            artifacts/h4a-visual/*
            artifacts/h4d1-buildings/*
            artifacts/h4c-natural/*
            artifacts/h4d4c-natural/*
            artifacts/h4d6-footfall/*
            artifacts/h4d7a-design/*
            artifacts/h4d7b-natural/*
            artifacts/h4d7c-review/*
            artifacts/terrain31-prototype/*
            artifacts/terrain31-hills/*
            artifacts/terrain31-world/*
            artifacts/terrain31-record/*
            artifacts/terrain31-legacy/*
            artifacts/terrain31-ground/*
            artifacts/terrain31-bridge-visual/*
            artifacts/terrain31-scene-tests/*
            artifacts/h4d3-concepts/*
          if-no-files-found: warn

  h3-longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Audit H3 housing for 2,000 and 10,000 years
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/evaluate-h3-housing.mjs | tee artifacts/h3-longrun.jsonl
      - name: Audit legacy continuation to 10,000 years
        run: node scripts/audit-legacy-terrain-save.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit generated ordinary facilities and reservation trials
        run: node scripts/audit-generated-facilities.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-longrun-audit
          path: |
            artifacts/h3-longrun.jsonl
            artifacts/terrain31-legacy/longrun-report.json
            artifacts/terrain31-facilities/*
          if-no-files-found: warn

  generated-housing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 21, 198]
        reservation: [wide, field-only, none]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Audit housing shard without reducing seeds, modes or years
        run: node scripts/audit-generated-housing.mjs
        env:
          AUDIT_HOUSING_SEED: ${{ matrix.seed }}
          AUDIT_HOUSING_MODE: ${{ matrix.reservation }}
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit civic construction with the same seeds, modes and years
        run: node scripts/audit-generated-housing.mjs
        env:
          AUDIT_CIVIC: '1'
          AUDIT_HOUSING_SEED: ${{ matrix.seed }}
          AUDIT_HOUSING_MODE: ${{ matrix.reservation }}
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit public-space foundation and lifecycle with all land uses
        run: node scripts/audit-generated-housing.mjs
        env:
          AUDIT_PUBLIC_SPACE: '1'
          AUDIT_HOUSING_SEED: ${{ matrix.seed }}
          AUDIT_HOUSING_MODE: ${{ matrix.reservation }}
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit bridge foundations, conditions and historical crossings
        run: node scripts/audit-generated-housing.mjs
        env:
          AUDIT_BRIDGE: '1'
          AUDIT_HOUSING_SEED: ${{ matrix.seed }}
          AUDIT_HOUSING_MODE: ${{ matrix.reservation }}
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain31-housing-${{ matrix.seed }}-${{ matrix.reservation }}
          path: |
            artifacts/terrain31-housing/*
            artifacts/terrain31-civic/*
            artifacts/terrain31-public-space/*
            artifacts/terrain31-bridge/*
          if-no-files-found: error

  generated-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare twelve generated worlds and all reservation policies
        run: node scripts/review-generated-scenes.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain31-scenes-q5
          path: artifacts/terrain31-scenes/*
          if-no-files-found: error

  generated-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify complete generated v5 draft at 10,000 years and preserve the old save
        run: node scripts/review-generated-save.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain31-v5-save-review
          path: artifacts/terrain31-save/*
          if-no-files-found: error

  generated-world-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture all 32 terrain families without construction history
        run: node scripts/review-terrain-families.mjs
      - name: Audit twelve natural worlds through production saves to 10,000 years
        run: node scripts/audit-generated-longrun.mjs
      - name: Preserve the direct model, choices and disaster dates in four long worlds
        run: node scripts/audit-generated-core-longrun.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain31-d5-acceptance
          retention-days: 14
          path: |
            artifacts/terrain31-families/*
            artifacts/terrain31-d5/index.html
            artifacts/terrain31-d5/report.json
            artifacts/terrain31-d5/core-comparison.json
            artifacts/terrain31-d5/*.png
            artifacts/terrain31-d5/*_save.json
          if-no-files-found: error

  organic-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify organic growth, saved continuation and compact fixtures
        run: node scripts/audit-organic-growth.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure organic annual progression against compact policy
        run: node scripts/benchmark-organic-growth.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare natural compact and organic scenery
        run: node scripts/review-organic-growth.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify cross-river v3 histories and saved continuation
        run: node scripts/audit-cross-river-growth.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare empty-bank reproduction and future-only opt-in
        run: node scripts/review-cross-river-growth.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain31-organic-growth
          retention-days: 14
          path: |
            artifacts/terrain31-organic/*
            artifacts/terrain31-cross-river/*
          if-no-files-found: error

  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Audit five 10,000-year worlds, past observations and gzip continuation
        run: node scripts/audit-environment.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure coupled climate against the existing vegetation policy
        run: node scripts/benchmark-environment.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure observation and native scenery across early and 10,000-year histories
        run: node scripts/benchmark-environment-scenes.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare natural histories and explicitly controlled climate and land use
        run: node scripts/review-environment.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare classic and detailed scenery at the same observed years
        run: node scripts/review-landscape-detail.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare climate vegetation, snowy mountains and the slower recorded cycle
        run: node scripts/review-climate-seasons.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit independent irrigation intake, occupation and pedestrian geometry
        run: node scripts/review-irrigation-kernel.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify irrigation lifecycle, trial saves, local ecology and 10,000-year continuation
        run: node scripts/review-irrigation-history.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-history
          retention-days: 14
          path: artifacts/environment34-irrigation-history/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-kernel
          retention-days: 14
          path: artifacts/environment34-irrigation-kernel/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-landscape-detail
          retention-days: 14
          path: |
            artifacts/environment34-detail/*
            artifacts/environment34-climate/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-acceptance
          retention-days: 14
          path: artifacts/environment34/*
          if-no-files-found: error

  scene-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare natural movement and controlled bridge and abandonment cases
        run: node scripts/review-scene-motion.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure preparation and native frames on desktop and throttled mobile
        run: node scripts/benchmark-scene-motion.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-motion33-acceptance
          retention-days: 14
          path: artifacts/motion33/*
          if-no-files-found: error

  vegetation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify vegetation histories, 10,000-year saves and unchanged civilization
        run: node scripts/audit-vegetation.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure annual progression with and without vegetation
        run: node scripts/benchmark-vegetation.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare natural succession and controlled clearing and fire recovery
        run: node scripts/review-vegetation.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vegetation32-acceptance
          retention-days: 14
          path: artifacts/vegetation32/*
          if-no-files-found: error

  irrigation-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Measure annual and full irrigation advancement with one warm-up and five samples
        run: node scripts/benchmark-irrigation.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit all five 10,000-year worlds and exact A2 reference values
        run: node scripts/audit-irrigation-acceptance.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare native scenery, lifecycle windows and controlled failures
        run: node scripts/review-irrigation-acceptance.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure first reads, warm observation and static preparation on desktop and CPU4x
        run: node scripts/benchmark-irrigation-observation.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-acceptance
          retention-days: 14
          path: artifacts/environment34-irrigation-acceptance/*
          if-no-files-found: error

  irrigation-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Benchmark actual production annual advancement and complete snapshots
        run: node scripts/benchmark-irrigation-production.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit five complete production worlds and exact A3 ecology with gzip continuation
        run: node scripts/audit-irrigation-production.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare production scenery, walking and moving water with desktop and CPU4x timings
        run: node scripts/review-irrigation-production.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-production
          retention-days: 14
          path: artifacts/environment34-irrigation-production/**
          if-no-files-found: error

  coupled-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Compare five neutral annual-driver worlds with pre-refactor B saves
        run: node scripts/audit-coupled-baseline.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure annual lifecycle and ecology against B with one warm-up and five runs
        run: node scripts/benchmark-annual-baseline.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit five annual ecology worlds against complete original B saves
        run: node scripts/audit-annual-baseline.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-coupled-baseline
          retention-days: 14
          path: |
            artifacts/environment34-irrigation-coupled/baseline-audit.json
            artifacts/environment34-irrigation-coupled/annual-baseline-audit.json
            artifacts/environment34-irrigation-coupled/annual-baseline-performance.json
          if-no-files-found: error

  coupled-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Audit neutral B and carried combined economics for five complete worlds
        run: node scripts/audit-coupled-effects.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment34-irrigation-coupled-effects
          retention-days: 14
          path: artifacts/environment34-irrigation-coupled/effects-audit.json
          if-no-files-found: error

  coupled-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Audit five independent compact C2 saves, cold readers and gzip continuation
        run: node scripts/audit-coupled-storage.mjs
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
