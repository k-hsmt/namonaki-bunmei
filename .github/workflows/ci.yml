name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  visual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify 10,000-year save in Chromium localStorage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/probe-h3-browser-storage.mjs | tee artifacts/h3-browser-storage.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-a-comparison
          path: |
            artifacts/visual-a/*.png
            artifacts/history-b/*
            artifacts/h1-housing/*
            artifacts/h3-browser-storage.jsonl
            artifacts/h4a-visual/*
            artifacts/h4d1-buildings/*
          if-no-files-found: warn

  h3-longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Audit H3 housing for 2,000 and 10,000 years
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/evaluate-h3-housing.mjs | tee artifacts/h3-longrun.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-longrun-audit
          path: artifacts/h3-longrun.jsonl
          if-no-files-found: warn
